groups:
  - name: athena.disk-space
    rules:
      - alert: AthenaRootDiskSpaceWarning
        expr: |
          (
            1 -
            athena_filesystem_avail_bytes{mountpoint="/"} /
            athena_filesystem_size_bytes{mountpoint="/"}
          ) > 0.80
        for: 15m
        labels:
          severity: warning
          service: filesystems
        annotations:
          summary: "athena root filesystem is above 80% used"
          description: "/ is {{ $value | humanizePercentage }} used."

      - alert: AthenaRootDiskSpaceCritical
        expr: |
          (
            1 -
            athena_filesystem_avail_bytes{mountpoint="/"} /
            athena_filesystem_size_bytes{mountpoint="/"}
          ) > 0.90
        for: 10m
        labels:
          severity: critical
          service: filesystems
        annotations:
          summary: "athena root filesystem is above 90% used"
          description: "/ is {{ $value | humanizePercentage }} used."

      - alert: AthenaHerculesDiskSpaceWarning
        expr: |
          (
            1 -
            athena_filesystem_avail_bytes{mountpoint="/mnt/hercules"} /
            athena_filesystem_size_bytes{mountpoint="/mnt/hercules"}
          ) > 0.80
        for: 15m
        labels:
          severity: warning
          service: filesystems
        annotations:
          summary: "athena /mnt/hercules filesystem is above 80% used"
          description: "/mnt/hercules is {{ $value | humanizePercentage }} used."

      - alert: AthenaHerculesDiskSpaceCritical
        expr: |
          (
            1 -
            athena_filesystem_avail_bytes{mountpoint="/mnt/hercules"} /
            athena_filesystem_size_bytes{mountpoint="/mnt/hercules"}
          ) > 0.90
        for: 10m
        labels:
          severity: critical
          service: filesystems
        annotations:
          summary: "athena /mnt/hercules filesystem is above 90% used"
          description: "/mnt/hercules is {{ $value | humanizePercentage }} used."

      - alert: AthenaHerculesDiskWillFillSoon
        expr: |
          predict_linear(
            athena_filesystem_avail_bytes{mountpoint="/mnt/hercules"}[6h],
            7 * 24 * 60 * 60
          ) < 0
        for: 30m
        labels:
          severity: warning
          service: filesystems
        annotations:
          summary: "athena /mnt/hercules is projected to fill within seven days"
          description: "Available bytes on /mnt/hercules are trending below zero within seven days."
